app-id: org.gnome.gedit
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: gedit

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --metadata=X-DConf=migrate-path=/org/gnome/gedit/
  # Needed at least for the integrated file browser plugin:
  - --filesystem=host
  # GVfs GIO APIs access using backend URIs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /man
  - /share/man
  - /share/gtk-doc
  - /share/vala
  - /share/gir-1.0
  - '*.la'
  - '*.a'

modules:
  - name: gedit
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.gnome.org/World/gedit/gedit.git
        tag: '51.0'
        commit: b7651f36c9337d20694ae6fe41f0fbe33a043f41
        x-checker-data:
          type: git
          tag-pattern: ^51\.\d+$

    modules:
      - name: libhandy
        buildsystem: meson
        config-opts:
          - -Dintrospection=disabled
          - -Dvapi=false
          - -Dtests=false
          - -Dexamples=false
          - -Dglade_catalog=disabled
        sources:
          - type: archive
            url: https://download.gnome.org/sources/libhandy/1.8/libhandy-1.8.3.tar.xz
            sha256: 05b497229073ff557f10b326e074c5066f8743a302d4820ab97bcb5cd2dab087
            x-checker-data:
              type: gnome
              name: libhandy

      - name: gspell
        buildsystem: meson
        config-opts:
          - -Dgspell_app=false
          - -Dgobject_introspection=false
          - -Dvapi=false
          - -Dgtk_doc=false
          - -Dtests=false
          - -Dinstall_tests=false
        sources:
          - type: git
            url: https://gitlab.gnome.org/GNOME/gspell.git
            tag: 1.14.5
            commit: 7bcc272d6cf469cb7aa0c7c35cea6b686077b9a2
            x-checker-data:
              type: git
              tag-pattern: ^1\.\d+\.\d+$

      - name: libgedit-gfls
        buildsystem: meson
        config-opts:
          - -Dgtk_doc=false
          - -Dtests=false
        sources:
          - type: git
            url: https://gitlab.gnome.org/World/gedit/libgedit-gfls.git
            tag: 0.5.0
            commit: 8ff9380b1796aa141c07f335ac10a405f39f988f
            x-checker-data:
              type: git
              tag-pattern: ^0\.5\.\d+$

      - name: libgedit-amtk
        buildsystem: meson
        config-opts:
          - -Dgtk_doc=false
          - -Dtests=false
        sources:
          - type: git
            url: https://gitlab.gnome.org/World/gedit/libgedit-amtk.git
            tag: 5.11.0
            commit: fcd22592dbe2589df622c31cf8fe823470ad28b5
            x-checker-data:
              type: git
              tag-pattern: ^5\.11\.\d+$

      - name: libpeas
        buildsystem: meson
        config-opts:
          - -Dlua51=false
          - -Dpython3=false
          - -Ddemos=false
          - -Dglade_catalog=false
        sources:
          - type: archive
            url: https://download.gnome.org/sources/libpeas/1.38/libpeas-1.38.1.tar.xz
            sha256: e82fd328adcac1aba34b64136bdfcbbacf2b3258a8bc4e5f480a72502a611ae9
            x-checker-data:
              type: gnome
              versions:
                <: '1.39'
              name: libpeas

      - name: libgedit-gtksourceview
        buildsystem: meson
        config-opts:
          - -Dgtk_doc=false
          - -Dtests=false
        sources:
          - type: git
            url: https://gitlab.gnome.org/World/gedit/libgedit-gtksourceview.git
            tag: 299.8.0
            commit: 80d2f107f915576f43a019abe26f13a9db21703c
            x-checker-data:
              type: git
              tag-pattern: ^299\.8\.\d+$

      - name: libgedit-tepl
        buildsystem: meson
        config-opts:
          - -Dgtk_doc=false
          - -Dtests=false
        sources:
          - type: git
            url: https://gitlab.gnome.org/World/gedit/libgedit-tepl.git
            tag: 6.15.0
            commit: 621fa9e8c43fafca8a0f299ac116715b3a835fbe
            x-checker-data:
              type: git
              tag-pattern: ^6\.15\.\d+$
